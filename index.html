<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotto Predictor Game</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="app-container">
    <h1>Lotto Predictor 🎲</h1>
    <p class="subtitle">Scannez, importez ou saisissez les numéros pour générer vos 4 numéros du jeu.</p>

    <div class="camera-card">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
      
      <!-- Option 1 : Scanner en direct -->
      <button id="btn-scan" class="btn-primary">📸 Scanner & Prédire</button>

      <!-- Option 2 : Importer une capture/photo -->
      <label for="file-input" class="btn-secondary" style="margin-top: 10px; display: block; text-align: center; cursor: pointer; padding: 12px; border-radius: 8px; font-weight: bold;">
        📁 Importer une image
      </label>
      <input type="file" id="file-input" accept="image/*" style="display: none;">

      <!-- Option 3 : Saisie manuelle directe -->
      <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
        <input type="text" id="manual-input" placeholder="Ex: 15, 27, 34, 12, 89" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.95rem; text-align: center; margin-bottom: 8px;">
        <button id="btn-manual" class="btn-secondary" style="width: 100%; padding: 10px;">✍️ Valider la saisie manuelle</button>
      </div>
    </div>

    <div id="status" class="status-text">Prêt à analyser...</div>

    <div class="results-card">
      <h2>Vos 4 Numéros Générés</h2>
      <div id="numbers-container" class="numbers-grid">
        <span class="num-ball">-</span>
        <span class="num-ball">-</span>
        <span class="num-ball">-</span>
        <span class="num-ball">-</span>
      </div>
    </div>

    <!-- Section Historique + Exportation -->
    <div class="results-card" style="margin-top: 15px;">
      <div class="history-header">
        <h2>Historique des Tirages</h2>
        <div class="btn-group">
          <button id="btn-export" class="btn-secondary">📥 Exporter (.txt)</button>
          <button id="btn-clear" class="btn-danger">🗑️ Effacer</button>
        </div>
      </div>
      <ul id="history-list" class="history-ul"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
